<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="324" viewBox="0 0 1000 324" role="img" aria-labelledby="title desc">
<title id="title">Telex Cues — Your text, ready for your next take</title><desc id="desc">Telex Cues converts supplied text into visible section headings and a Telex-ready script. Animation is decorative; all information is available as static text.</desc>
<defs><radialGradient id="glow"><stop stop-color="#0066FF" stop-opacity=".65"/><stop offset="1" stop-color="#0066FF" stop-opacity="0"/></radialGradient><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" stroke="#8BA4DF" stroke-opacity=".09" fill="none"/></pattern></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.mono{font-family:Menlo,Consolas,monospace}.pulse{animation:breathe 6s ease-in-out infinite}.scan{animation:scan 8s ease-in-out infinite}@keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}@keyframes scan{0%,100%{transform:translateY(0)}50%{transform:translateY(64px)}}@media(prefers-reduced-motion:reduce){.pulse,.scan{animation:none}}</style>
<rect width="1000" height="324" rx="20" fill="#090D16"/><rect width="1000" height="324" rx="20" fill="url(#grid)"/><ellipse class="pulse" cx="650" cy="110" rx="420" ry="220" fill="url(#glow)"/><rect x="1" y="1" width="998" height="322" rx="19" fill="none" stroke="#334B75"/><text x="48" y="50" font-size="12" fill="#90ADFF" font-weight="700">TELEX / OPEN-SOURCE CODEX SKILL</text><text x="45" y="119" font-size="61" fill="#F8FAFC" font-weight="800">Your text.</text><text x="45" y="182" font-size="51" fill="#F8FAFC" font-weight="800">Ready for your next take.</text><text x="48" y="230" font-size="21" fill="#BAC8E4" font-weight="400">Natural sections. Navigable cues. Your original voice.</text><text x="48" y="284" font-size="20" fill="#8EAEFF" font-weight="700">$telex-cues</text><rect x="696" y="0" width="260" height="244" rx="24" fill="#000"/><rect x="696" width="260" height="40" fill="#000"/><circle cx="826" cy="20" r="3" fill="#253452"/><rect class="scan" x="716" y="62" width="220" height="35" rx="6" fill="#0066FF" opacity=".18"/><text x="728" y="86" font-size="17" fill="#D9E4FF" font-weight="400"># Opening</text><text x="728" y="118" font-size="17" fill="#D9E4FF" font-weight="400">Your words, close.</text><text x="728" y="150" font-size="17" fill="#D9E4FF" font-weight="400"># The big idea</text><text x="728" y="182" font-size="17" fill="#D9E4FF" font-weight="400">Keep your eyes up.</text></svg>
