<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="212" viewBox="0 0 1000 212" role="img" aria-labelledby="title desc">
<title id="title">Bring your words, shape the sections, read in Telex</title><desc id="desc">Telex Cues converts supplied text into visible section headings and a Telex-ready script. Animation is decorative; all information is available as static text.</desc>
<defs><radialGradient id="glow"><stop stop-color="#0066FF" stop-opacity=".65"/><stop offset="1" stop-color="#0066FF" stop-opacity="0"/></radialGradient><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" stroke="#8BA4DF" stroke-opacity=".09" fill="none"/></pattern></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.mono{font-family:Menlo,Consolas,monospace}.pulse{animation:breathe 6s ease-in-out infinite}.scan{animation:scan 8s ease-in-out infinite}@keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}@keyframes scan{0%,100%{transform:translateY(0)}50%{transform:translateY(64px)}}@media(prefers-reduced-motion:reduce){.pulse,.scan{animation:none}}</style>
<rect width="1000" height="212" rx="20" fill="#090D16"/><rect width="1000" height="212" rx="20" fill="url(#grid)"/><ellipse class="pulse" cx="650" cy="110" rx="420" ry="220" fill="url(#glow)"/><rect x="1" y="1" width="998" height="210" rx="19" fill="none" stroke="#334B75"/><rect x="24" y="24" width="300" height="164" rx="12" fill="#0B1426" stroke="#2A416A"/><text x="44" y="54" font-size="13" fill="#759FFF" font-weight="700">01</text><text x="44" y="91" font-size="23" fill="#F8FAFC" font-weight="700">Bring your words</text><text x="44" y="127" font-size="15" fill="#ACBBD6" font-weight="400">Paste prose, notes or a script.</text><text x="44" y="152" font-size="15" fill="#ACBBD6" font-weight="400">Keep the language and facts.</text><rect x="350" y="24" width="300" height="164" rx="12" fill="#0B1426" stroke="#2A416A"/><text x="370" y="54" font-size="13" fill="#759FFF" font-weight="700">02</text><text x="370" y="91" font-size="23" fill="#F8FAFC" font-weight="700">Shape the sections</text><text x="370" y="127" font-size="15" fill="#ACBBD6" font-weight="400">Add short, meaningful cue titles.</text><text x="370" y="152" font-size="15" fill="#ACBBD6" font-weight="400">Preserve wording by default.</text><rect x="676" y="24" width="300" height="164" rx="12" fill="#0B1426" stroke="#2A416A"/><text x="696" y="54" font-size="13" fill="#759FFF" font-weight="700">03</text><text x="696" y="91" font-size="23" fill="#F8FAFC" font-weight="700">Read in Telex</text><text x="696" y="127" font-size="15" fill="#ACBBD6" font-weight="400">Copy or import UTF-8 text.</text><text x="696" y="152" font-size="15" fill="#ACBBD6" font-weight="400">Jump to the thought you need.</text></svg>
