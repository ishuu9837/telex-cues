<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="281" viewBox="0 0 1000 281" role="img" aria-labelledby="title desc">
<title id="title">Original wording preserved with Progress and Next steps cues</title><desc id="desc">Telex Cues converts supplied text into visible section headings and a Telex-ready script. Animation is decorative; all information is available as static text.</desc>
<defs><radialGradient id="glow"><stop stop-color="#0066FF" stop-opacity=".65"/><stop offset="1" stop-color="#0066FF" stop-opacity="0"/></radialGradient><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" stroke="#8BA4DF" stroke-opacity=".09" fill="none"/></pattern></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.mono{font-family:Menlo,Consolas,monospace}.pulse{animation:breathe 6s ease-in-out infinite}.scan{animation:scan 8s ease-in-out infinite}@keyframes breathe{0%,100%{opacity:.5}50%{opacity:1}}@keyframes scan{0%,100%{transform:translateY(0)}50%{transform:translateY(64px)}}@media(prefers-reduced-motion:reduce){.pulse,.scan{animation:none}}</style>
<rect width="1000" height="281" rx="20" fill="#090D16"/><rect width="1000" height="281" rx="20" fill="url(#grid)"/><ellipse class="pulse" cx="650" cy="110" rx="420" ry="220" fill="url(#glow)"/><rect x="1" y="1" width="998" height="279" rx="19" fill="none" stroke="#334B75"/><text x="35" y="45" font-size="12" fill="#90ADFF" font-weight="700">SAME WORDS. CLEARER WAYPOINTS.</text><rect x="24" y="67" width="420" height="190" rx="12" fill="#0B1426" stroke="#2A416A"/><rect x="526" y="67" width="450" height="190" rx="12" fill="#0B1426" stroke="#2A416A"/><text x="46" y="100" font-size="16" fill="#B8C7E0" font-weight="400">YOUR TEXT</text><text x="46" y="141" font-size="16" fill="#B8C7E0" font-weight="400">Welcome, everyone.</text><text x="46" y="176" font-size="16" fill="#B8C7E0" font-weight="400">Today we review our progress.</text><text x="46" y="211" font-size="16" fill="#B8C7E0" font-weight="400">Next, we will gather feedback.</text><text x="467" y="169" font-size="35" fill="#759FFF" font-weight="400">→</text><rect class="scan" x="545" y="115" width="410" height="29" rx="4" fill="#0066FF" opacity=".14"/><text x="547" y="99" font-size="15" fill="#B8C7E0" font-weight="400">TELEX-READY</text><text x="547" y="133" font-size="15" fill="#B8C7E0" font-weight="400"># Progress</text><text x="547" y="164" font-size="15" fill="#B8C7E0" font-weight="400">Welcome, everyone.</text><text x="547" y="195" font-size="15" fill="#B8C7E0" font-weight="400">Today we review our progress.</text><text x="547" y="225" font-size="15" fill="#B8C7E0" font-weight="400"># Next steps</text><text x="547" y="247" font-size="15" fill="#B8C7E0" font-weight="400">Next, we will gather feedback.</text></svg>
